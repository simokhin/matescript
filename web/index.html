<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>TS Chess Engine</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div id="app">
            <aside class="panel--settings">
                <h2>New game</h2>

                <div class="field">
                    <span class="field__label">Play as</span>
                    <div class="side-toggle">
                        <button
                            type="button"
                            class="side-option is-selected"
                            data-side="white"
                            aria-pressed="true"
                        >
                            <span
                                class="side-option__swatch side-option__swatch--white"
                            ></span>
                            White
                        </button>
                        <button
                            type="button"
                            class="side-option"
                            data-side="black"
                            aria-pressed="false"
                        >
                            <span
                                class="side-option__swatch side-option__swatch--black"
                            ></span>
                            Black
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label class="field__label" for="movetime-input"
                        >Time per move (ms)</label
                    >
                    <input
                        id="movetime-input"
                        class="field__input"
                        type="number"
                        min="50"
                        step="50"
                        value="1000"
                    />
                </div>

                <div class="field">
                    <label class="field__label" for="fen-input"
                        >Starting position (FEN)</label
                    >
                    <input
                        id="fen-input"
                        class="field__input field__input--mono"
                        type="text"
                        placeholder="Leave empty for standard start"
                    />
                </div>

                <button id="start-game" class="start-button" type="button">
                    Start game
                </button>
            </aside>
            <main class="stage">
                <div id="board" class="board"></div>
                <div
                    id="promotion-picker"
                    class="promotion-picker"
                    hidden
                ></div>
            </main>
            <aside class="panel--moves">
                <h2>Engine</h2>
                <div id="engine-info">
                    <div class="engine-info__placeholder">
                        Waiting for a move…
                    </div>
                </div>
                <h2>Moves</h2>
                <div id="moves"></div>
            </aside>
        </div>
        <script type="module" src="/main.ts"></script>
    </body>
</html>
