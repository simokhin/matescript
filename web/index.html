<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0e1116" />
        <title>MateScript</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div id="app">
            <aside class="panel--settings">
                <div class="site-title">MateScript</div>

                <h2>New game</h2>

                <div id="settings-form">
                    <div class="field">
                        <span class="field__label">Play as</span>
                        <div class="side-toggle">
                            <button
                                type="button"
                                class="side-option is-selected"
                                data-side="white"
                                aria-pressed="true"
                            >
                                <span
                                    class="side-option__swatch side-option__swatch--white"
                                ></span>
                                White
                            </button>
                            <button
                                type="button"
                                class="side-option"
                                data-side="black"
                                aria-pressed="false"
                            >
                                <span
                                    class="side-option__swatch side-option__swatch--black"
                                ></span>
                                Black
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field__label" for="movetime-input"
                            >Time per move (ms)</label
                        >
                        <input
                            id="movetime-input"
                            class="field__input"
                            type="number"
                            min="50"
                            step="50"
                            value="1000"
                        />
                    </div>

                    <div class="field">
                        <label class="field__label" for="fen-input"
                            >Starting position (FEN)</label
                        >
                        <input
                            id="fen-input"
                            class="field__input field__input--mono"
                            type="text"
                            placeholder="Leave empty for standard start"
                        />
                        <span id="fen-error" class="field__error" hidden
                            >Invalid FEN string</span
                        >
                    </div>

                    <button
                        id="start-game"
                        class="start-button"
                        type="button"
                    >
                        Start game
                    </button>
                </div>

                <div id="settings-summary" class="settings-summary" hidden>
                    <p id="settings-summary-text" class="field__label"></p>
                    <button
                        id="new-game-button"
                        class="start-button"
                        type="button"
                    >
                        New game
                    </button>
                </div>
            </aside>
            <main class="stage">
                <div class="board-wrapper">
                    <div id="board" class="board"></div>
                    <div id="board-overlay" class="board-overlay">
                        <span
                            class="board-overlay__arrow"
                            aria-hidden="true"
                        ></span>
                        Start a game to play
                    </div>
                </div>
                <div
                    id="promotion-picker"
                    class="promotion-picker"
                    hidden
                ></div>
            </main>
            <aside class="panel--moves">
                <h2>Engine</h2>
                <div id="engine-info">
                    <div class="engine-info__placeholder">
                        Waiting for a move…
                    </div>
                </div>
                <h2>Moves</h2>
                <div id="moves"></div>
            </aside>
        </div>
        <a
            class="repo-link"
            href="https://github.com/simokhin/matescript"
            target="_blank"
            rel="noopener noreferrer"
        >
            GitHub
        </a>
        <script type="module" src="/main.ts"></script>
    </body>
</html>
